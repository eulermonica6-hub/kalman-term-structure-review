<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <style>.title{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 16px Arial,sans-serif;fill:#0f172a}.t{font:14px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.box{stroke:#64748b;stroke-width:2;rx:12}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Kalman-like filters for term-structure estimation</text>
  <text x="600" y="67" text-anchor="middle" class="small">Systematic review → state-space abstraction → algorithm and evidence comparison</text>
  <rect x="40" y="105" width="250" height="185" fill="#dbeafe" class="box"/><text x="60" y="135" class="h">1. Literature engineering</text><text x="60" y="165" class="t">5 academic databases</text><text x="60" y="188" class="t">1990–2025 search window</text><text x="60" y="211" class="t">2,345 initial records</text><text x="60" y="234" class="t">345 abstract-screened</text><text x="60" y="257" class="t">101 included studies</text>
  <rect x="330" y="105" width="250" height="185" fill="#dcfce7" class="box"/><text x="350" y="135" class="h">2. Unified state space</text><text x="350" y="165" class="t">Continuous → discrete dynamics</text><text x="350" y="188" class="t">Latent short rate / factors</text><text x="350" y="211" class="t">Bond price / yield observation</text><text x="350" y="234" class="t">Vasicek · CIR · affine models</text><text x="350" y="257" class="t">Panel + time-series information</text>
  <rect x="620" y="105" width="250" height="185" fill="#fef3c7" class="box"/><text x="640" y="135" class="h">3. Filter family</text><text x="640" y="165" class="t">KF: linear Gaussian</text><text x="640" y="188" class="t">EKF / IEKF: Jacobian</text><text x="640" y="211" class="t">UKF: sigma points</text><text x="640" y="234" class="t">SRUKF: square-root covariance</text><text x="640" y="257" class="t">KF-QML and extensions</text>
  <rect x="910" y="105" width="250" height="185" fill="#fce7f3" class="box"/><text x="930" y="135" class="h">4. Tuning surface</text><text x="930" y="165" class="t">Initial state x̂₀</text><text x="930" y="188" class="t">Initial covariance P₀</text><text x="930" y="211" class="t">Noise covariance Q / R</text><text x="930" y="234" class="t">Sigma-point parameters</text><text x="930" y="257" class="t">Numerical stability</text>
  <path d="M290 198 H330 M580 198 H620 M870 198 H910" class="arrow"/>
  <rect x="100" y="370" width="300" height="190" fill="#ede9fe" class="box"/><text x="120" y="400" class="h">Evidence synthesis</text><text x="120" y="432" class="t">Published simulation results</text><text x="120" y="455" class="t">US / China / Europe / India</text><text x="120" y="478" class="t">Fama–Bliss · SHIBOR · LIBOR</text><text x="120" y="501" class="t">Swap rates and bond yields</text><text x="120" y="524" class="t">Data access constraints recorded</text>
  <rect x="450" y="370" width="300" height="190" fill="#e0f2fe" class="box"/><text x="470" y="400" class="h">Comparative evaluation</text><text x="470" y="432" class="t">RMSE and parameter error</text><text x="470" y="455" class="t">Convergence trajectories</text><text x="470" y="478" class="t">CPU time / complexity</text><text x="470" y="501" class="t">1,000 independent runs</text><text x="470" y="524" class="t">Wilcoxon stability tests</text>
  <rect x="820" y="370" width="300" height="190" fill="#dcfce7" class="box"/><text x="840" y="400" class="h">Decision framework</text><text x="840" y="432" class="t">Linear Gaussian → KF</text><text x="840" y="455" class="t">Weak nonlinear → EKF</text><text x="840" y="478" class="t">Nonlinear → UKF</text><text x="840" y="501" class="t">Stability-critical → SRUKF</text><text x="840" y="524" class="t">Trade accuracy vs compute</text>
  <path d="M1035 290 V330 H250 V370 M1035 290 V330 H600 V370 M1035 290 V330 H970 V370" class="arrow"/>
  <rect x="190" y="635" width="820" height="72" fill="#0f172a" rx="14"/><text x="600" y="664" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:white">Evidence chain: searchable literature → common equations → filter selection → reproducible comparison</text><text x="600" y="688" text-anchor="middle" style="font:13px Arial,sans-serif;fill:#cbd5e1">CIR: UKF vs EKF p &lt; 0.001 · Vasicek: p = 0.073 · SRUKF favors stability at modest CPU cost</text>
</svg>
