<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#000"/></marker>
    <style>
      .b{fill:#fff;stroke:#000;stroke-width:2}.l{fill:none;stroke:#000;stroke-width:2;marker-end:url(#a)}
      .t{font-family:Arial,sans-serif;fill:#000}.h{font-size:17px;font-weight:700}.p{font-size:14px}.s{font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="t h">A MAP OF KALMAN-LIKE TERM-STRUCTURE METHODS</text>
  <text x="600" y="66" text-anchor="middle" class="t s">A review architecture from literature evidence to method choice</text>

  <rect x="55" y="125" width="235" height="125" class="b"/>
  <text x="172" y="158" text-anchor="middle" class="t h">LITERATURE</text>
  <text x="172" y="187" text-anchor="middle" class="t p">search</text>
  <text x="172" y="213" text-anchor="middle" class="t p">screening</text>
  <text x="172" y="239" text-anchor="middle" class="t p">evidence map</text>

  <rect x="335" y="125" width="235" height="125" class="b"/>
  <text x="452" y="158" text-anchor="middle" class="t h">TERM STRUCTURE</text>
  <text x="452" y="187" text-anchor="middle" class="t p">latent rate factors</text>
  <text x="452" y="213" text-anchor="middle" class="t p">bond prices</text>
  <text x="452" y="239" text-anchor="middle" class="t p">yields across maturities</text>

  <rect x="615" y="125" width="235" height="125" class="b"/>
  <text x="732" y="158" text-anchor="middle" class="t h">STATE SPACE</text>
  <text x="732" y="187" text-anchor="middle" class="t p">state dynamics</text>
  <text x="732" y="213" text-anchor="middle" class="t p">observation process</text>
  <text x="732" y="239" text-anchor="middle" class="t p">hidden variables</text>

  <rect x="895" y="125" width="250" height="125" class="b"/>
  <text x="1020" y="158" text-anchor="middle" class="t h">FILTER FAMILY</text>
  <text x="1020" y="187" text-anchor="middle" class="t p">linear</text>
  <text x="1020" y="213" text-anchor="middle" class="t p">locally nonlinear</text>
  <text x="1020" y="239" text-anchor="middle" class="t p">numerically stable</text>

  <path d="M290 187H335M570 187H615M850 187H895" class="l"/>

  <rect x="190" y="365" width="250" height="125" class="b"/>
  <text x="315" y="398" text-anchor="middle" class="t h">MODEL CONDITIONS</text>
  <text x="315" y="426" text-anchor="middle" class="t p">linearity</text>
  <text x="315" y="452" text-anchor="middle" class="t p">nonlinearity</text>
  <text x="315" y="478" text-anchor="middle" class="t p">noise structure</text>

  <rect x="475" y="365" width="250" height="125" class="b"/>
  <text x="600" y="398" text-anchor="middle" class="t h">IMPLEMENTATION</text>
  <text x="600" y="426" text-anchor="middle" class="t p">initialization</text>
  <text x="600" y="452" text-anchor="middle" class="t p">covariance tuning</text>
  <text x="600" y="478" text-anchor="middle" class="t p">numerical propagation</text>

  <rect x="760" y="365" width="250" height="125" class="b"/>
  <text x="885" y="398" text-anchor="middle" class="t h">EVIDENCE</text>
  <text x="885" y="426" text-anchor="middle" class="t p">estimation error</text>
  <text x="885" y="452" text-anchor="middle" class="t p">convergence</text>
  <text x="885" y="478" text-anchor="middle" class="t p">stability and cost</text>

  <path d="M1020 250V300H315V365M1020 250V300H600V365M1020 250V300H885V365" class="l"/>
  <path d="M885 490V535H172V250" class="l"/>
  <rect x="245" y="565" width="710" height="64" class="b"/>
  <text x="600" y="593" text-anchor="middle" class="t h">REVIEW LOGIC</text>
  <text x="600" y="616" text-anchor="middle" class="t p">context → representation → algorithm → tuning → evidence-based choice</text>
</svg>
